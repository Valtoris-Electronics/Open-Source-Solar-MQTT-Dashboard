version: '3.8'

services:
  # MQTT Broker (Receives JSON from the Edge Gateway)
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  # Time-Series Database (Stores the power metrics)
  influxdb:
    image: influxdb:1.8
    container_name: influxdb_solar
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=solar_metrics
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=adminpassword
    volumes:
      - ./influxdb:/var/lib/influxdb
    restart: unless-stopped

  # Automation & Routing (Moves MQTT data into InfluxDB)
  nodered:
    image: nodered/node-red:latest
    container_name: nodered_parser
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

  # Dashboard (Visualizes the data)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped
